# Configuration profile for the telemetry event log (PostgreSQL 16 + TimescaleDB 2.x).
shared_preload_libraries = 'timescaledb'

# Durability: events are the system of record.
wal_level = replica
synchronous_commit = on

# Write-heavy ingestion tuning.
max_wal_size = 8GB
checkpoint_timeout = 15min
wal_compression = on
timescaledb.max_background_workers = 8

# Backup / PITR: continuous WAL archiving.
archive_mode = on
archive_command = 'test ! -f /backup/wal/%f && cp %p /backup/wal/%f'
archive_timeout = 300
