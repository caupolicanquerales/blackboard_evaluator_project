# Backup and recovery settings: periodic base snapshots + WAL archiving for PITR (PostgreSQL 16)
wal_level = replica
archive_mode = on
archive_command = 'test ! -f ${WAL_ARCHIVE_DIR}/%f && cp %p ${WAL_ARCHIVE_DIR}/%f'
archive_timeout = 60
max_wal_senders = 4

# Periodic snapshot (run by scheduler, e.g. daily):
#   pg_basebackup -D ${BACKUP_DIR}/base_$(date +%Y%m%d) -Ft -z -X stream
# Point-in-time recovery:
#   restore base backup, set restore_command = 'cp ${WAL_ARCHIVE_DIR}/%f %p',
#   recovery_target_time = '<timestamp>', then touch recovery.signal
# Replay is idempotent: uq_telemetry_record_events_record_revision rejects duplicate revisions
# (use INSERT ... ON CONFLICT DO NOTHING when re-ingesting).
