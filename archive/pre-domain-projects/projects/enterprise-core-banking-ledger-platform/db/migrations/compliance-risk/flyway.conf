# Flyway configuration - bounded context: compliance-risk (PostgreSQL 16)
# Connection values are injected from the environment.
flyway.url=jdbc:postgresql://${COMPLIANCE_RISK_DB_HOST}:${COMPLIANCE_RISK_DB_PORT}/${COMPLIANCE_RISK_DB_NAME}
flyway.user=${COMPLIANCE_RISK_DB_USER}
flyway.password=${COMPLIANCE_RISK_DB_PASSWORD}

flyway.schemas=compliance_risk
flyway.defaultSchema=compliance_risk
flyway.createSchemas=true
flyway.table=flyway_schema_history

flyway.locations=filesystem:db/migrations/compliance-risk
flyway.cleanDisabled=true
flyway.validateOnMigrate=true
flyway.baselineOnMigrate=false
flyway.outOfOrder=false
