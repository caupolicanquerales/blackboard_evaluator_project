# Fragment to be merged by the config unit into src/main/resources/application.yml (read by Spring Boot).
# Scripts in db/migrations must be copied to src/main/resources/db/migration.
spring:
  r2dbc:
    url: ${TELEMETRY_R2DBC_URL}
    username: ${TELEMETRY_DB_USER}
    password: ${TELEMETRY_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${TELEMETRY_JDBC_URL}
    user: ${TELEMETRY_DB_USER}
    password: ${TELEMETRY_DB_PASSWORD}
---
spring:
  config:
    activate:
      on-profile: test
  r2dbc:
    url: r2dbc:h2:mem:///telemetry;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
  flyway:
    enabled: false
