spring:
  application:
    name: telemetry-ingestion-processing
  flyway:
    locations: classpath:db/migration
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/telemetry}
    username: ${R2DBC_USERNAME:telemetry}
    password: ${R2DBC_PASSWORD:telemetry}
telemetry:
  backfill:
    window-seconds: 60
  buffer:
    capacity: 1024
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
logging:
  file:
    name: logs/telemetry-ingestion-processing.log
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
