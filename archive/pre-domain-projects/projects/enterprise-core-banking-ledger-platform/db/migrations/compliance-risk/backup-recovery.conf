# Backup and recovery settings - bounded context: compliance-risk (PostgreSQL 16)
# Point-in-time recovery with regular snapshots; audit data (override log, SAR) retained per regulation.
wal_level=replica
archive_mode=on
archive_command=<set by infrastructure: ship WAL to durable archive>
archive_timeout=300

snapshot_schedule=daily
snapshot_retention=regulatory   # retention period set by compliance; audit data never purged earlier
pitr_retention_days=35
restore_drill_frequency=quarterly
