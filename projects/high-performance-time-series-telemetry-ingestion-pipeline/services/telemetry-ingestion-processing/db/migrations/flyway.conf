# Flyway profile. Production: PostgreSQL 16 (r2dbc at runtime, JDBC for Flyway).
# Local/test profile: in-process H2 in PostgreSQL mode, overridden via environment.
flyway.url=${TELEMETRY_DB_JDBC_URL:jdbc:postgresql://localhost:5432/telemetry}
flyway.user=${TELEMETRY_DB_USER}
flyway.password=${TELEMETRY_DB_PASSWORD}
flyway.locations=filesystem:db/migrations
flyway.defaultSchema=telemetry
flyway.schemas=telemetry
flyway.baselineOnMigrate=false
flyway.cleanDisabled=true
flyway.outOfOrder=false
# Local/test override: jdbc:h2:mem:telemetry;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
