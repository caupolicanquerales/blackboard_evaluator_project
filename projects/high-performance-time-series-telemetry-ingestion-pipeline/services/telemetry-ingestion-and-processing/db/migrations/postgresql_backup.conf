# Backup/recovery settings (PostgreSQL 16): ledger is rebuildable only from source; retain backups.
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /backup/wal/%f && cp %p /backup/wal/%f'
archive_timeout = 300
max_wal_senders = 3

# Periodic base snapshots (run by infrastructure scheduler):
#   pg_basebackup -D /backup/base/$(date +%Y%m%dT%H%M%S) -Ft -z -X stream
# Schedule: daily; retain 14 days of base backups and the WAL needed to restore them.
# Recovery: restore latest base backup, set restore_command = 'cp /backup/wal/%f %p', add recovery.signal.
