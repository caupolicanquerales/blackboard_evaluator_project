# Flyway configuration - bounded context: treasury-fx (PostgreSQL 16)
# Connection values are injected from the environment.
flyway.url=jdbc:postgresql://${TREASURY_FX_DB_HOST}:${TREASURY_FX_DB_PORT}/${TREASURY_FX_DB_NAME}
flyway.user=${TREASURY_FX_DB_USER}
flyway.password=${TREASURY_FX_DB_PASSWORD}

flyway.schemas=treasury_fx
flyway.defaultSchema=treasury_fx
flyway.createSchemas=true
flyway.table=flyway_schema_history

flyway.locations=filesystem:db/migrations/treasury-fx
flyway.cleanDisabled=true
flyway.validateOnMigrate=true
flyway.baselineOnMigrate=false
flyway.outOfOrder=false
