# Flyway runner profile; credentials come from the environment.
flyway.url=jdbc:postgresql://${TELEMETRY_DB_HOST}:${TELEMETRY_DB_PORT}/${TELEMETRY_DB_NAME}
flyway.user=${TELEMETRY_DB_USER}
flyway.password=${TELEMETRY_DB_PASSWORD}
flyway.locations=filesystem:db/migrations/telemetry-ingestion-processing
flyway.cleanDisabled=true
flyway.validateOnMigrate=true
flyway.outOfOrder=false
