# Configuration profile for Flyway migrations (run at startup).
flyway.locations=filesystem:db/migrations
flyway.schemas=telemetry_event_log
flyway.defaultSchema=telemetry_event_log
flyway.createSchemas=true
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
flyway.outOfOrder=false
# Boot tests use the embedded H2 substitute with the same locations.
