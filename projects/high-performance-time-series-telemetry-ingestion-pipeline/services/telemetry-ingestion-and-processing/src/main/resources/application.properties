spring.application.name=telemetry-ingestion-and-processing

spring.r2dbc.url=${TELEMETRY_R2DBC_URL:r2dbc:h2:mem:///telemetry;DB_CLOSE_DELAY=-1}
spring.r2dbc.username=${TELEMETRY_DB_USER:sa}
spring.r2dbc.password=${TELEMETRY_DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.url=${TELEMETRY_FLYWAY_URL:jdbc:h2:mem:telemetry;DB_CLOSE_DELAY=-1}
spring.flyway.user=${TELEMETRY_DB_USER:sa}
spring.flyway.password=${TELEMETRY_DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration
spring.flyway.fail-on-missing-locations=false
spring.flyway.baseline-on-migrate=false
