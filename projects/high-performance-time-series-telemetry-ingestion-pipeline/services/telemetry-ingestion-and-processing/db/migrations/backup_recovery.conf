# Backup/recovery profile for the telemetry ledger (PostgreSQL 16).
# Include from postgresql.conf. WAL archiving enables point-in-time recovery;
# pair with periodic base snapshots (e.g. pg_basebackup daily).
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300
max_wal_senders = 3
# Restore: restore base snapshot, set restore_command to read wal_archive,
# recovery_target_time as needed. Append-only ledger needs no row reconciliation.
