spring.application.name=telemetry-ingestion-processing

# Embedded in-process H2 (PostgreSQL mode) substitute; override for real PostgreSQL
spring.r2dbc.url=r2dbc:h2:mem:///telemetry;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.r2dbc.username=sa
spring.r2dbc.password=

spring.flyway.enabled=true
spring.flyway.url=jdbc:h2:mem:telemetry;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.flyway.user=sa
spring.flyway.password=
spring.flyway.locations=classpath:db/migration
