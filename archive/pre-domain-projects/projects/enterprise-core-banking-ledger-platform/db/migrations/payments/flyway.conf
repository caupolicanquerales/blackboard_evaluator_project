# Flyway configuration - bounded context: payments (PostgreSQL 16)
# Connection values are injected from the environment.
flyway.url=jdbc:postgresql://${PAYMENTS_DB_HOST}:${PAYMENTS_DB_PORT}/${PAYMENTS_DB_NAME}
flyway.user=${PAYMENTS_DB_USER}
flyway.password=${PAYMENTS_DB_PASSWORD}

flyway.schemas=payments
flyway.defaultSchema=payments
flyway.createSchemas=true
flyway.table=flyway_schema_history

flyway.locations=filesystem:db/migrations/payments
flyway.cleanDisabled=true
flyway.validateOnMigrate=true
flyway.baselineOnMigrate=false
flyway.outOfOrder=false
