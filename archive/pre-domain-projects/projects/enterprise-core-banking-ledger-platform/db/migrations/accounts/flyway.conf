# Flyway configuration - bounded context: accounts (PostgreSQL 16)
# Connection values are injected from the environment.
flyway.url=jdbc:postgresql://${ACCOUNTS_DB_HOST}:${ACCOUNTS_DB_PORT}/${ACCOUNTS_DB_NAME}
flyway.user=${ACCOUNTS_DB_USER}
flyway.password=${ACCOUNTS_DB_PASSWORD}

flyway.schemas=accounts
flyway.defaultSchema=accounts
flyway.createSchemas=true
flyway.table=flyway_schema_history

flyway.locations=filesystem:db/migrations/accounts
flyway.cleanDisabled=true
flyway.validateOnMigrate=true
flyway.baselineOnMigrate=false
flyway.outOfOrder=false
