spring.application.name=telemetry-ingestion-and-processing
spring.r2dbc.url=r2dbc:h2:mem:///telemetry;DB_CLOSE_DELAY=-1
spring.flyway.enabled=true
spring.flyway.url=jdbc:h2:mem:telemetry;DB_CLOSE_DELAY=-1
spring.flyway.user=sa
spring.flyway.password=
spring.flyway.locations=classpath:db/migration
spring.flyway.fail-on-missing-locations=false
