# Configuration profile: Flyway runs at application startup (expand-only migrations)
flyway.locations=filesystem:db/migrations
flyway.schemas=ledger
flyway.defaultSchema=ledger
flyway.createSchemas=true
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
flyway.outOfOrder=false
flyway.baselineOnMigrate=false
# Connection values come from the environment, never literals
flyway.url=${FLYWAY_URL}
flyway.user=${FLYWAY_USER}
flyway.password=${FLYWAY_PASSWORD}

# Test profile: embeddable PostgreSQL-compatible substitute (Testcontainers PostgreSQL 16 or
# embedded postgres) runs the same scripts; no H2 dialect fork.
