# Backup and recovery settings for the PostgreSQL 16 telemetry store.
# Append-only history permits replay and reconstruction after restore.
wal_level=replica
archive_mode=on
archive_command=<site-specific WAL archive command>
base_backup_schedule=daily
base_backup_retention_days=14
wal_archive_retention_days=14
pitr_enabled=true
pitr_target=timestamp
# Open: retention/partitioning of high-volume data is undecided; no deletes are scheduled.
