telemetry:
  reorder-window-seconds: 60
  buffer-capacity: 1024
  heart-rate-min: 30
  heart-rate-max: 240
  power-min: 0
  power-max: 2500
  cadence-min: 0
  cadence-max: 220
  swim-pace-min-exclusive: 45

spring:
  application:
    name: telemetry-ingestion-processing
  r2dbc:
    url: r2dbc:h2:mem:///telemetry;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: true
    url: jdbc:h2:mem:telemetry;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    user: sa
    password: ""
    locations: classpath:db/migration

logging:
  structured:
    format:
      file: ecs
  file:
    name: logs/telemetry-ingestion-processing.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
  level:
    com.pulsestream.telemetry: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
