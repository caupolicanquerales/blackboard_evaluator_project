# Flyway configuration - bounded context: general-ledger (PostgreSQL 16)
# Connection values are injected from the environment.
flyway.url=jdbc:postgresql://${GENERAL_LEDGER_DB_HOST}:${GENERAL_LEDGER_DB_PORT}/${GENERAL_LEDGER_DB_NAME}
flyway.user=${GENERAL_LEDGER_DB_USER}
flyway.password=${GENERAL_LEDGER_DB_PASSWORD}

flyway.schemas=general_ledger
flyway.defaultSchema=general_ledger
flyway.createSchemas=true
flyway.table=flyway_schema_history

flyway.locations=filesystem:db/migrations/general-ledger
flyway.cleanDisabled=true
flyway.validateOnMigrate=true
flyway.baselineOnMigrate=false
flyway.outOfOrder=false
